services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      # These are embedded in the client-side bundle
      args:
        - DB_USER=${DB_USER}
        - DB_PASSWORD=${DB_PASSWORD}
        - DB_HOST=${DB_HOST}
        - DB_PORT=${DB_PORT}
        - DB_NAME=${DB_NAME}
        - NEXT_PUBLIC_GOWAPP_HOST_URL=${NEXT_PUBLIC_GOWAPP_HOST_URL}
    container_name: nenichat-web
    restart: always
    ports:
      - "3001:3000"
    env_file:
      - .env
